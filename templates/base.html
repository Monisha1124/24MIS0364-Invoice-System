<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice System {{ app_version|upper }}</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font-family:Arial,sans-serif}.top{background:#142b4a;color:white;padding:22px max(5%,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}.top small{color:#b8c9df}.wrap{max-width:1100px;margin:35px auto;padding:0 18px}.card{background:white;border-radius:14px;padding:24px;margin-bottom:22px;box-shadow:0 5px 20px #142b4a12}h1{margin:0 0 8px}h2{margin-top:0;color:#142b4a}label{display:block;font-weight:bold;margin:12px 0 6px}input{width:100%;padding:11px;border:1px solid #ccd5e2;border-radius:7px}button,.btn{display:inline-block;background:#2563eb;color:white;border:0;padding:11px 17px;border-radius:7px;text-decoration:none;cursor:pointer;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e6ebf2}th{background:#f5f8fc}.msg{padding:12px;border-radius:7px;background:#e8f8ef;margin:10px 0}.error{background:#ffeded}.muted{color:#63738a}.actions a{margin-right:10px}.tag{background:#dbeafe;color:#1d4ed8;padding:6px 10px;border-radius:20px;font-size:12px}
</style></head><body><header class="top"><div><strong>INVOICE SYSTEM</strong><br><small>Progressive application delivery</small></div><span class="tag">{{ app_version|upper }}</span></header><main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{ 'error' if category=='error' else '' }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
