{% extends "base.html" %}{% block content %}<section class="card"><h1>Edit Invoice {{invoice.invoice_number}}</h1><form method="post"><label>Customer Name</label><input name="customer_name" value="{{invoice.customer_name}}" required><label>Invoice Date</label><input type="date" name="invoice_date" value="{{invoice.invoice_date}}" required><label>Amount (₹)</label><input type="number" name="amount" min="0" step="0.01" value="{{invoice.amount}}" required><button>Save Changes</button> <a class="btn" href="{{url_for('invoices')}}">Back</a></form></section>{% endblock %}
