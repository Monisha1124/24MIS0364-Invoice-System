apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-v2
  template:
    metadata:
      labels:
        app: invoice-v2
    spec:
      containers:
        - name: invoice
          image: YOUR_DOCKERHUB_USERNAME/24mis0364-invoice-system:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2"
            - name: DATABASE
              value: "/tmp/invoices-v2.db"
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-v2
spec:
  type: NodePort
  selector:
    app: invoice-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
