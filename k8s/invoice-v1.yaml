apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-v1
  template:
    metadata:
      labels:
        app: invoice-v1
    spec:
      containers:
        - name: invoice
          image: monisha1124/24mis0364-invoice-system:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1"
            - name: DATABASE
              value: "/tmp/invoices-v1.db"
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-v1
spec:
  type: NodePort
  selector:
    app: invoice-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081
